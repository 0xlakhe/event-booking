[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eventbook-backend"
version = "0.2.0"
description = "EventBook FastAPI backend (TASK-002 schema, privileges, seed)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.35",
  "psycopg[binary]==3.2.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.0",
  "alembic==1.14.1",
  "argon2-cffi==23.1.0",
  "httpx==0.27.2",
  "pytest==8.3.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
